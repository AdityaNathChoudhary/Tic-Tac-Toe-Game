<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="Fivegrid.css">
</head>
<body>
    <a href="index.html">
        <button id="back-button">Back to Dashboard</button>
    </a>
    <h1>Tic-Tac-Toe</h1>
    <div id="winner" hidden>
        <h1 id="winner-label">Winner Is :</h1>
        <div id="winner-name">
            <h1 id="winner-text"></h1>
        </div>
    </div>
    <div id="game-board">
        <button class="boxes"id="0"></button>
         <button class="boxes"id="1"></button>
          <button class="boxes"id="2"></button>
           <button class="boxes"id="3"></button>
            <button class="boxes"id="4"></button>
             <button class="boxes" id="5"></button>
              <button class="boxes"id="6"></button>
                <button class="boxes"id="7"></button>
                 <button class="boxes"id="8"></button>
                    <button class="boxes"id="9"></button>
                     <button class="boxes"id="10"></button>
                        <button class="boxes"id="11"></button>
                         <button class="boxes"id="12"></button>
                        <button class="boxes" id="13"></button>
                         <button class="boxes"id="14"></button>
                            <button class="boxes"id="15"></button>
                            <button class="boxes"id="16"></button>
                             <button class="boxes"id="17"></button>
                              <button class="boxes"id="18"></button>
                               <button class="boxes"id="19"></button>
                                <button class="boxes"id="20"></button>
                                 <button class="boxes"id="21"></button>
                                  <button class="boxes"id="22"></button>
                                   <button class="boxes"id="23"></button>
                                    <button class="boxes"id="24"></button>
    </div>
    <button id="reset-button">Reset Game</button>
</body>
<script src="Fivegrid.js"></script>
</html>
